<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>US Stock Monitor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-sub: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --blue: #58a6ff;
      --accent: #1f6feb;
      --flash-green: rgba(63,185,80,.25);
      --flash-red: rgba(248,81,73,.25);
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 320px 1fr;
      grid-template-areas:
        "topbar  topbar"
        "sidebar main"
        "alerts  alerts";
      min-height: 100vh;
      gap: 0;
    }

    /* ── Top Bar ── */
    .topbar {
      grid-area: topbar;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .topbar-title { font-size: 18px; font-weight: 700; color: var(--text); }
    .market-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface2);
      border: 1px solid var(--border);
      transition: all .3s;
    }
    .market-badge.open  { border-color: var(--green); color: var(--green); }
    .market-badge.closed{ border-color: var(--red);   color: var(--red); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .last-updated { color: var(--text-sub); font-size: 12px; }

    /* ── Button ── */
    .btn {
      padding: 7px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background .15s, border-color .15s;
    }
    .btn:hover { background: var(--border); border-color: var(--text-sub); }
    .btn-primary { background: var(--accent); border-color: var(--accent); }
    .btn-primary:hover { background: #388bfd; border-color: #388bfd; }
    .btn-danger  { background: transparent; border-color: var(--red); color: var(--red); }
    .btn-danger:hover  { background: rgba(248,81,73,.1); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ── Sidebar ── */
    .sidebar {
      grid-area: sidebar;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
      max-height: calc(100vh - 53px);
      position: sticky;
      top: 53px;
    }
    .sidebar-section { margin-bottom: 24px; }
    .sidebar-section h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    /* Add form */
    .add-form { display: flex; flex-direction: column; gap: 8px; }
    .input-row { display: flex; gap: 8px; }
    .form-input {
      flex: 1;
      padding: 7px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    .form-input:focus { border-color: var(--blue); }
    .form-input::placeholder { color: var(--text-sub); }
    .threshold-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-sub); }
    .threshold-row .form-input { width: 80px; flex: none; }

    /* Watchlist table */
    .watchlist-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .watchlist-table th {
      text-align: left;
      color: var(--text-sub);
      font-weight: 500;
      padding: 4px 6px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    .watchlist-table td { padding: 6px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .watchlist-table tr:last-child td { border-bottom: none; }
    .symbol-tag {
      font-weight: 700;
      font-size: 13px;
      color: var(--blue);
    }
    .stock-name-cell { color: var(--text-sub); font-size: 12px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .threshold-edit { display: flex; align-items: center; gap: 4px; }
    .threshold-input {
      width: 52px;
      padding: 3px 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
    }
    .empty-watchlist { color: var(--text-sub); font-size: 13px; text-align: center; padding: 16px 0; }

    /* ── Main Content ── */
    .main {
      grid-area: main;
      padding: 20px;
      overflow-y: auto;
    }
    .main h2 { font-size: 14px; color: var(--text-sub); margin-bottom: 16px; text-transform: uppercase; letter-spacing: .08em; }

    /* Stock Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .stock-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      transition: border-color .3s, background .3s;
      position: relative;
      overflow: hidden;
    }
    .stock-card.flash-up   { background: var(--flash-green); border-color: var(--green); }
    .stock-card.flash-down { background: var(--flash-red);   border-color: var(--red); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .card-symbol { font-size: 20px; font-weight: 800; color: var(--text); }
    .card-name   { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
    .card-price  { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .card-change { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .card-change.up   { color: var(--green); }
    .card-change.down { color: var(--red); }
    .card-change.flat { color: var(--text-sub); }
    .card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .card-meta-item { font-size: 11px; color: var(--text-sub); }
    .card-meta-item span { display: block; color: var(--text); font-size: 12px; font-weight: 500; }
    .card-updated { font-size: 10px; color: var(--text-sub); margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
    .no-data-card {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      color: var(--text-sub);
    }

    /* ── Alerts Panel ── */
    .alerts-panel {
      grid-area: alerts;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 20px;
    }
    .alerts-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .alerts-header h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-sub); }
    .alerts-badge {
      background: var(--yellow);
      color: #000;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 10px;
    }
    .alerts-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
    .alert-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: var(--surface2);
      border-radius: 6px;
      border-left: 3px solid var(--yellow);
      font-size: 13px;
    }
    .alert-symbol { font-weight: 700; color: var(--blue); min-width: 52px; }
    .alert-msg    { flex: 1; color: var(--text); }
    .alert-trigger{ color: var(--yellow); font-weight: 600; font-size: 12px; white-space: nowrap; }
    .alert-time   { color: var(--text-sub); font-size: 11px; white-space: nowrap; }
    .no-alerts    { color: var(--text-sub); font-size: 13px; text-align: center; padding: 8px 0; }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      top: 70px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: #1c2f1c;
      border: 1px solid var(--green);
      color: var(--green);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      max-width: 340px;
      animation: slideIn .3s ease, fadeOut .4s ease 3.6s forwards;
      pointer-events: auto;
    }
    .toast.alert-toast { background: #2e1a1a; border-color: var(--yellow); color: var(--yellow); }
    @keyframes slideIn  { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut  { from { opacity: 1; } to { opacity: 0; pointer-events: none; } }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-areas:
          "topbar"
          "sidebar"
          "main"
          "alerts";
      }
      .sidebar { max-height: none; position: static; }
      .cards-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .cards-grid { grid-template-columns: 1fr; }
      .topbar-title { font-size: 15px; }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<div class="layout">

  <!-- ── Top Bar ── -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">📈 US Stock Monitor</span>
      <div id="market-badge" class="market-badge closed">
        <span class="dot"></span>
        <span id="market-status-text">Market Closed</span>
      </div>
    </div>
    <div class="topbar-right">
      <span id="last-updated" class="last-updated">—</span>
      <button class="btn btn-primary" onclick="manualRefresh()">↻ Refresh</button>
    </div>
  </header>

  <!-- ── Sidebar：Watchlist ── -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <h3>Add Symbol</h3>
      <div class="add-form">
        <div class="input-row">
          <input id="input-symbol" class="form-input" type="text" placeholder="e.g. TSLA" maxlength="10" />
          <button class="btn btn-primary" onclick="addSymbol()">Add</button>
        </div>
        <div class="threshold-row">
          <label>Alert threshold</label>
          <input id="input-threshold" class="form-input" type="number" value="5" min="0.1" max="100" step="0.5" />
          <span>%</span>
        </div>
      </div>
    </div>
    <div class="sidebar-section">
      <h3>Watchlist</h3>
      <table class="watchlist-table">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Threshold</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="watchlist-tbody">
          <tr><td colspan="3" class="empty-watchlist">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </aside>

  <!-- ── Main：Stock Cards ── -->
  <main class="main">
    <h2>Live Quotes</h2>
    <div id="cards-grid" class="cards-grid">
      <div class="no-data-card">No data yet — click Refresh or wait for next poll.</div>
    </div>
  </main>

  <!-- ── Alerts Panel ── -->
  <section class="alerts-panel">
    <div class="alerts-header">
      <h3>Alert History <span id="alert-count-badge" class="alerts-badge" style="display:none">0</span></h3>
      <button class="btn btn-sm" onclick="loadAlerts()">↻</button>
    </div>
    <div id="alerts-list" class="alerts-list">
      <p class="no-alerts">No alerts yet.</p>
    </div>
  </section>

</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  const quotesMap   = {};   // symbol → latest quote dict
  const alertsCache = [];   // array of alert items (newest first)

  // ── SocketIO ───────────────────────────────────────────────────────────────
  const socket = io({ transports: ['websocket', 'polling'] });

  socket.on('connect', () => {
    console.log('SocketIO connected');
    showToast('Connected to server', 'ok');
  });

  socket.on('disconnect', () => {
    console.log('SocketIO disconnected');
    showToast('Disconnected from server', 'alert');
  });

  socket.on('price_update', ({ quotes }) => {
    if (!Array.isArray(quotes)) return;
    quotes.forEach(q => { quotesMap[q.symbol] = q; });
    renderCards();
    setLastUpdated(new Date().toLocaleTimeString());
  });

  socket.on('alert_triggered', (alert) => {
    prependAlert(alert);
    renderAlerts();
    showToast(`⚠ ${alert.symbol}: ${alert.message}`, 'alert');
  });

  // ── Init ───────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    checkMarketStatus();
    loadWatchlist();
    loadQuotes();
    loadAlerts();
    setInterval(checkMarketStatus, 60_000);
  });

  // ── Market Status ─────────────────────────────────────────────────────────
  async function checkMarketStatus() {
    try {
      const res = await fetch('/api/market-status');
      const data = await res.json();
      const badge = document.getElementById('market-badge');
      const text  = document.getElementById('market-status-text');
      badge.className = `market-badge ${data.is_open ? 'open' : 'closed'}`;
      text.textContent = data.is_open ? 'Market Open' : 'Market Closed';
    } catch (e) { /* silent */ }
  }

  // ── Watchlist ─────────────────────────────────────────────────────────────
  async function loadWatchlist() {
    try {
      const res = await fetch('/api/watchlist');
      const list = await res.json();
      renderWatchlist(list);
    } catch (e) { console.error('loadWatchlist failed', e); }
  }

  function renderWatchlist(list) {
    const tbody = document.getElementById('watchlist-tbody');
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="3" class="empty-watchlist">No symbols yet.</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(item => `
      <tr id="wl-row-${item.symbol}">
        <td>
          <div class="symbol-tag">${escape(item.symbol)}</div>
          <div class="stock-name-cell" title="${escape(item.name || '')}">${escape(item.name || '—')}</div>
        </td>
        <td>
          <div class="threshold-edit">
            <input class="threshold-input" id="thr-${item.symbol}" type="number"
              value="${item.alert_threshold_pct}" min="0.1" max="100" step="0.5" />
            <button class="btn btn-sm" onclick="saveThreshold('${item.symbol}')">✓</button>
          </div>
        </td>
        <td>
          <button class="btn btn-sm btn-danger" onclick="removeSymbol('${item.symbol}')">🗑</button>
        </td>
      </tr>
    `).join('');
  }

  async function addSymbol() {
    const symbolInput = document.getElementById('input-symbol');
    const threshInput = document.getElementById('input-threshold');
    const symbol    = symbolInput.value.trim().toUpperCase();
    const threshold = parseFloat(threshInput.value) || 5.0;
    if (!symbol) { showToast('Please enter a symbol', 'alert'); return; }

    try {
      const res = await fetch('/api/watchlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ symbol, threshold }),
      });
      if (!res.ok) {
        const err = await res.json();
        showToast(`Error: ${err.error || res.status}`, 'alert');
        return;
      }
      symbolInput.value = '';
      showToast(`${symbol} added to watchlist`, 'ok');
      loadWatchlist();
    } catch (e) { showToast('Network error', 'alert'); }
  }

  async function removeSymbol(symbol) {
    if (!confirm(`Remove ${symbol} from watchlist?`)) return;
    try {
      await fetch(`/api/watchlist/${symbol}`, { method: 'DELETE' });
      // Remove card immediately
      delete quotesMap[symbol];
      renderCards();
      showToast(`${symbol} removed`, 'ok');
      loadWatchlist();
    } catch (e) { showToast('Network error', 'alert'); }
  }

  async function saveThreshold(symbol) {
    const input = document.getElementById(`thr-${symbol}`);
    const threshold = parseFloat(input.value);
    if (isNaN(threshold) || threshold <= 0) { showToast('Invalid threshold', 'alert'); return; }
    try {
      const res = await fetch(`/api/watchlist/${symbol}/threshold`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ threshold }),
      });
      if (res.ok) { showToast(`${symbol} threshold updated to ${threshold}%`, 'ok'); }
    } catch (e) { showToast('Network error', 'alert'); }
  }

  // ── Quotes ────────────────────────────────────────────────────────────────
  async function loadQuotes() {
    try {
      const res = await fetch('/api/quotes');
      const data = await res.json();
      if (data.quotes) {
        data.quotes.forEach(q => { quotesMap[q.symbol] = q; });
        renderCards();
        if (data.quotes.length) setLastUpdated(new Date().toLocaleTimeString());
      }
    } catch (e) { console.error('loadQuotes failed', e); }
  }

  async function manualRefresh() {
    socket.emit('request_refresh');
    showToast('Refresh requested…', 'ok');
    // Also poll alerts
    loadAlerts();
  }

  function renderCards() {
    const grid = document.getElementById('cards-grid');
    const quotes = Object.values(quotesMap);
    if (!quotes.length) {
      grid.innerHTML = '<div class="no-data-card">No data yet — click Refresh or wait for next poll.</div>';
      return;
    }
    quotes.sort((a, b) => a.symbol.localeCompare(b.symbol));
    grid.innerHTML = quotes.map(q => buildCard(q)).join('');
  }

  function buildCard(q) {
    const pct     = q.change_percent ?? 0;
    const amt     = q.change_amount  ?? 0;
    const direction = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
    const sign    = pct > 0 ? '+' : '';
    const price   = formatPrice(q.price);
    const vol     = formatVolume(q.volume);
    const mcap    = formatMarketCap(q.market_cap);
    const updated = formatTime(q.updated_at || q.recorded_at);

    return `
      <div class="stock-card" id="card-${q.symbol}">
        <div class="card-header">
          <div>
            <div class="card-symbol">${escape(q.symbol)}</div>
            <div class="card-name">${escape(q.name || '')}</div>
          </div>
        </div>
        <div class="card-price">$${price}</div>
        <div class="card-change ${direction}">
          <span>${sign}${formatPrice(amt)}</span>
          <span>${sign}${pct.toFixed(2)}%</span>
        </div>
        <div class="card-meta">
          <div class="card-meta-item">Volume<span>${vol}</span></div>
          <div class="card-meta-item">Mkt Cap<span>${mcap}</span></div>
          <div class="card-meta-item">Prev Close<span>$${formatPrice(q.prev_close)}</span></div>
        </div>
        <div class="card-updated">Updated ${updated}</div>
      </div>`;
  }

  function flashCard(symbol, direction) {
    const card = document.getElementById(`card-${symbol}`);
    if (!card) return;
    const cls = direction === 'up' ? 'flash-up' : 'flash-down';
    card.classList.add(cls);
    setTimeout(() => card.classList.remove(cls), 1500);
  }

  // Override price_update to also flash cards
  socket.on('price_update', ({ quotes }) => {
    if (!Array.isArray(quotes)) return;
    quotes.forEach(q => {
      const prev = quotesMap[q.symbol];
      quotesMap[q.symbol] = q;
      if (prev !== undefined) {
        const dir = (q.price ?? 0) >= (prev.price ?? 0) ? 'up' : 'down';
        // Delay flash until DOM updated
        setTimeout(() => flashCard(q.symbol, dir), 50);
      }
    });
    renderCards();
    setLastUpdated(new Date().toLocaleTimeString());
  });

  // ── Alerts ────────────────────────────────────────────────────────────────
  async function loadAlerts() {
    try {
      const res = await fetch('/api/alerts?limit=20');
      const list = await res.json();
      alertsCache.length = 0;
      alertsCache.push(...list);
      renderAlerts();
    } catch (e) { console.error('loadAlerts failed', e); }
  }

  function prependAlert(alert) {
    alertsCache.unshift({
      symbol:        alert.symbol,
      message:       alert.message,
      trigger_value: alert.trigger_value,
      threshold:     alert.threshold,
      created_at:    alert.created_at || new Date().toISOString(),
    });
    if (alertsCache.length > 20) alertsCache.pop();
  }

  function renderAlerts() {
    const list  = document.getElementById('alerts-list');
    const badge = document.getElementById('alert-count-badge');
    const count = alertsCache.length;
    badge.textContent = count;
    badge.style.display = count ? 'inline' : 'none';

    if (!count) {
      list.innerHTML = '<p class="no-alerts">No alerts yet.</p>';
      return;
    }
    list.innerHTML = alertsCache.map(a => `
      <div class="alert-item">
        <span class="alert-symbol">${escape(a.symbol)}</span>
        <span class="alert-msg">${escape(a.message || '')}</span>
        <span class="alert-trigger">${formatPct(a.trigger_value)} / ${formatPct(a.threshold)}</span>
        <span class="alert-time">${formatTime(a.created_at)}</span>
      </div>
    `).join('');
  }

  // ── Toast ──────────────────────────────────────────────────────────────────
  function showToast(message, type = 'ok') {
    const container = document.getElementById('toast-container');
    const div = document.createElement('div');
    div.className = `toast${type === 'alert' ? ' alert-toast' : ''}`;
    div.textContent = message;
    container.appendChild(div);
    setTimeout(() => div.remove(), 4200);
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function setLastUpdated(t) {
    document.getElementById('last-updated').textContent = `Updated ${t}`;
  }

  function escape(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatPrice(v) {
    if (v == null || isNaN(v)) return '—';
    return Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatVolume(v) {
    if (!v) return '—';
    if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
    if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
    return String(v);
  }

  function formatMarketCap(v) {
    if (!v) return '—';
    if (v >= 1e12) return '$' + (v / 1e12).toFixed(2) + 'T';
    if (v >= 1e9)  return '$' + (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6)  return '$' + (v / 1e6).toFixed(2) + 'M';
    return '$' + v;
  }

  function formatPct(v) {
    if (v == null) return '—';
    const sign = v >= 0 ? '+' : '';
    return `${sign}${Number(v).toFixed(2)}%`;
  }

  function formatTime(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch { return iso; }
  }

  // Allow Enter key on symbol input
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('input-symbol').addEventListener('keydown', e => {
      if (e.key === 'Enter') addSymbol();
    });
  });
</script>

</body>
</html>
